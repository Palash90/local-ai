use_default_settings:
  engines:
    keep_only:
      - bing
      - google
      - duckduckgo
      - brave
      - mojeek
      - wikipedia

# keep_only only trims the engine list; the default `disabled` flag of each
# engine still applies (bing/mojeek ship disabled upstream). Enable them
# explicitly so queries never depend on a single unblocked engine.
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false

server:
  secret_key: "ultrasecretkeyforsearxng"
  base_url: false
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  default_category: web
  formats:
    - html
    - json

outgoing:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  request_timeout: 10.0
  max_request_timeout: 15.0