use_default_settings:
  engines:
    keep_only:
      # General & News
      - google
      - bing
      - duckduckgo
      - brave
      - mojeek
      - wikipedia
      - google news
      # IT / Code
      - github
      - stackoverflow
      # Science
      - arxiv
      - google scholar

# Explicitly enable engines that ship disabled upstream
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: google scholar
    disabled: false

server:
  secret_key: "GENERATE_A_RANDOM_32_BYTE_HEX_STRING" # Replace this!
  base_url: false
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  default_category: general
  formats:
    - html
    - json

outgoing:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  request_timeout: 10.0
  max_request_timeout: 15.0
  extra_headers:
    Accept-Language: "en-US,en;q=0.9"
    Accept-Encoding: "gzip, deflate"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    DNT: "1"
    Connection: "keep-alive"
    Upgrade-Insecure-Requests: "1"